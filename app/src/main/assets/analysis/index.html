<!doctype html>
<html lang="en" class="board-assets-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <title>InstinctaZero analysis</title>
  <link rel="stylesheet" href="analysis.css">
  <link rel="stylesheet" href="phone.css">
  <link rel="preload" as="image" href="brown.svg">
  <link rel="preload" as="image" href="pieces/wK.svg"><link rel="preload" as="image" href="pieces/wQ.svg"><link rel="preload" as="image" href="pieces/wR.svg"><link rel="preload" as="image" href="pieces/wB.svg"><link rel="preload" as="image" href="pieces/wN.svg"><link rel="preload" as="image" href="pieces/wP.svg">
  <link rel="preload" as="image" href="pieces/bK.svg"><link rel="preload" as="image" href="pieces/bQ.svg"><link rel="preload" as="image" href="pieces/bR.svg"><link rel="preload" as="image" href="pieces/bB.svg"><link rel="preload" as="image" href="pieces/bN.svg"><link rel="preload" as="image" href="pieces/bP.svg">
</head>
<body>
  <main id="app" aria-label="Offline chess analysis">
    <header class="top"><button class="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M14.5 4 6.5 12l8 8"/></svg></button><div class="game-title"><strong><span data-study-title>Local analysis</span></strong><small>Starting position</small></div><div id="tab-title" class="tab-title" aria-label="Leela evaluation">Leela</div></header>
    <section id="board-wrap" class="board-wrap cburnett" aria-label="Chess board"><div id="board" class="board" role="application"><svg id="arrows" viewBox="0 0 512 512" aria-hidden="true"><defs><marker id="arrow-blue" markerWidth="4" markerHeight="4" refX="2.05" refY="2" orient="auto"><path d="M0,0 V4 L3,2 Z" fill="#003088"/></marker><marker id="arrow-grey" markerWidth="4" markerHeight="4" refX="2.05" refY="2" orient="auto"><path d="M0,0 V4 L3,2 Z" fill="#4a4a4a"/></marker></defs></svg></div></section>
    <section class="analysis">
      <nav class="tabs" aria-label="Analysis tabs"><button data-tab="info" aria-label="Info"><i class="fa" aria-hidden="true">&#xf05a;</i><span>Study</span></button><button data-tab="moves" aria-label="Moves"><i class="fa" aria-hidden="true">&#xf022;</i><span>Moves</span></button><button data-tab="engine" class="selected" aria-label="Engine"><i class="fa" aria-hidden="true">&#xf085;</i><span>Leela</span></button><button data-tab="chart" aria-label="Chart"><i class="fa" aria-hidden="true">&#xf1fe;</i><span>Chart</span></button><button data-tab="book" aria-label="Book"><i class="fa" aria-hidden="true">&#xf02d;</i><span>Book</span></button><button data-panel-tab="settings" class="panel-tab" aria-label="Close settings" hidden><i class="fa" aria-hidden="true">&#xf013;</i><span>Settings</span></button></nav>
      <div id="panel" class="panel"></div>
    </section>
    <footer class="actions"><button data-action="menu" class="fa" aria-label="More">&#xf141;</button><button data-action="settings" class="fa" aria-label="Settings">&#xf013;</button><button data-action="flip" aria-label="Flip board"><svg viewBox="0 0 24 24"><path d="M7 7h7l-2-2m2 2-2 2M17 17h-7l2 2m-2-2 2-2M5 7a7 7 0 0 1 12-2M19 17A7 7 0 0 1 7 19"/></svg></button><button data-action="mainline" class="return-mainline" aria-label="Return to mainline intersection"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18M18 5c-5 0-8 3-8 8v4m-3-3 3 3 3-3"/></svg><span>Mainline</span></button><button data-action="prev" aria-label="Previous move"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><button data-action="next" aria-label="Next move"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button></footer>
  </main>
  <script src="legacy-chessground.js"></script><script src="chess-rules.js"></script><script src="analysis.js"></script>
</body>
</html>
