name: Edited-line audit
on:
  push:
    branches: [perf/edited-line-lookup-20260917]
    paths: [.github/workflows/edited-line-audit.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
      - name: Measure baseline without optimized work budgets
        env:
          EDITED_LINE_BASELINE: '1'
          EDITED_LINE_OUTPUT: ${{ runner.temp }}/edited-line-baseline.json
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx2048m -Dfile.encoding=UTF-8' :app:testDebugUnitTest --tests '*RepertoireEditedLinePerformanceTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edited-line-baseline
          path: |
            ${{ runner.temp }}/edited-line-baseline.json
            app/build/test-results
            app/build/reports/tests
          retention-days: 7
