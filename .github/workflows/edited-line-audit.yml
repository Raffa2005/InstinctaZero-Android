name: Edited-line audit
on:
  push:
    branches: [perf/edited-line-lookup-20260917]
    paths: [.github/workflows/edited-line-audit.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: edited-line-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 1
