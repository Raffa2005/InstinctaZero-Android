name: Finalize independent audit

on:
  push:
    branches: [perf/independent-audit-20260917-b7e4]
    paths: [.github/workflows/optimization-audit-snapshot.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/independent-audit-20260917-b7e4
      - name: Apply exact reviewed follow-up files and remove audit scaffolding
        env:
          AUDIT_BRANCH: perf/independent-audit-20260917-b7e4
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          paths = []
          for item in json.loads(pathlib.Path('.audit/followup.json').read_text()):
              path = pathlib.Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('app', 'web', 'tools')
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == item['before'], f'Base changed: {path}'
              lines = old.decode().splitlines(keepends=True)
              for edit in reversed(item['edits']):
                  lines[edit['start']:edit['end']] = [edit['text']]
              data = ''.join(lines).encode()
              assert hashlib.sha256(data).hexdigest() == item['after'], f'Patch mismatch: {path}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              paths.append(str(path))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git rm .audit/native.json .audit/web.json .audit/followup.json .github/workflows/optimization-audit-snapshot.yml
          git diff --cached --check
          git config user.name 'Raffa2005'
          git config user.email '54407238+Raffa2005@users.noreply.github.com'
          git commit -m 'perf: bound index-build working sets and batch duplicate lookups' -m 'Correct response-body test bytes and await scheduled privacy rendering. Remove all temporary audit manifests and publishing workflow; permanent read-only CI validates the clean PR.'
          git push origin "HEAD:$AUDIT_BRANCH"
          echo "Published $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
