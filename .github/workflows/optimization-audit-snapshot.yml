name: Independent audit snapshot

on:
  push:
    branches: [perf/independent-audit-20260917-b7e4]
    paths: [.github/workflows/optimization-audit-snapshot.yml]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/audit-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: independent-audit-source
          path: ${{ runner.temp }}/audit-source.tar
          retention-days: 1
          if-no-files-found: error
