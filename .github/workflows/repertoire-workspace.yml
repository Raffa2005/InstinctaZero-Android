name: Repertoire workspace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python policy tests and synthetic source package
        run: |
          python -m pip install -r tools/repertoire/requirements.txt
          python -m unittest discover -s tools/repertoire/tests -v
          python tools/repertoire/generate_fixture.py .repertoire-work/fixture
          python tools/repertoire/repertoire_index.py --folder .repertoire-work/fixture/annotations check
      - name: Browser source and controller checks
        run: |
          npm ci --prefix web
          npm run check --prefix web
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
      - name: Native tests with generated source fixture
        env:
          REPERTOIRE_PORTABLE_INDEX: ${{ github.workspace }}/.repertoire-work/fixture/annotations/repertoire.sqlite
        run: ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs='-Xmx1024m -Dfile.encoding=UTF-8' :app:testDebugUnitTest
